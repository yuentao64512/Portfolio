<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffedd5"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#475569}
      .section{font:700 22px Arial,sans-serif;fill:#1e293b}.box-title{font:700 19px Arial,sans-serif;fill:#0f172a}
      .body{font:400 15px Arial,sans-serif;fill:#334155}.small{font:400 13px Arial,sans-serif;fill:#475569}
      .box{stroke:#64748b;stroke-width:2;rx:16;filter:url(#shadow)}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="80" y="62" class="title">RSE4207 Pose-Action and Fall Alert Visual Pipeline</text>
  <text x="80" y="94" class="subtitle">Runtime detection flow and the supporting training flow used by the current workspace</text>

  <text x="80" y="145" class="section">A. Runtime detection pipeline</text>
  <rect x="80" y="175" width="220" height="125" fill="url(#blue)" class="box"/>
  <text x="190" y="212" text-anchor="middle" class="box-title">Camera / video</text>
  <text x="190" y="242" text-anchor="middle" class="body">Live camera, saved video,</text><text x="190" y="264" text-anchor="middle" class="body">or test frame stream</text>
  <path d="M300 237 H365" class="arrow"/>

  <rect x="365" y="175" width="250" height="125" fill="url(#blue)" class="box"/>
  <text x="490" y="212" text-anchor="middle" class="box-title">Pose detector</text>
  <text x="490" y="242" text-anchor="middle" class="body">YOLO11n-pose PyTorch</text><text x="490" y="264" text-anchor="middle" class="body">or TensorRT FP16 lite</text>
  <path d="M615 237 H680" class="arrow"/>

  <rect x="680" y="175" width="235" height="125" fill="url(#green)" class="box"/>
  <text x="797" y="212" text-anchor="middle" class="box-title">Person tracking</text>
  <text x="797" y="242" text-anchor="middle" class="body">Maintain track ID</text><text x="797" y="264" text-anchor="middle" class="body">for each detected person</text>
  <path d="M915 237 H980" class="arrow"/>

  <rect x="980" y="175" width="250" height="125" fill="url(#green)" class="box"/>
  <text x="1105" y="212" text-anchor="middle" class="box-title">Keypoint processing</text>
  <text x="1105" y="242" text-anchor="middle" class="body">17 COCO points → 12 body</text><text x="1105" y="264" text-anchor="middle" class="body">points, normalized features</text>
  <path d="M1230 237 H1295" class="arrow"/>

  <rect x="1295" y="175" width="225" height="125" fill="url(#orange)" class="box"/>
  <text x="1407" y="212" text-anchor="middle" class="box-title">Temporal window</text>
  <text x="1407" y="242" text-anchor="middle" class="body">12 pose frames</text><text x="1407" y="264" text-anchor="middle" class="body">per action decision</text>

  <path d="M1407 300 V365" class="arrow"/>
  <rect x="1275" y="365" width="265" height="125" fill="url(#orange)" class="box"/>
  <text x="1407" y="402" text-anchor="middle" class="box-title">Feature extraction</text>
  <text x="1407" y="432" text-anchor="middle" class="body">Pose statistics, velocity,</text><text x="1407" y="454" text-anchor="middle" class="body">visibility and hip motion</text>
  <path d="M1275 427 H1205" class="arrow"/>

  <rect x="940" y="365" width="265" height="125" fill="url(#orange)" class="box"/>
  <text x="1072" y="402" text-anchor="middle" class="box-title">Action classifier</text>
  <text x="1072" y="432" text-anchor="middle" class="body">Random Forest bundle</text><text x="1072" y="454" text-anchor="middle" class="body">falling, lying, walking,</text><text x="1072" y="474" text-anchor="middle" class="body">standing, sitting</text>
  <path d="M940 427 H870" class="arrow"/>

  <rect x="605" y="365" width="265" height="125" fill="url(#red)" class="box"/>
  <text x="737" y="402" text-anchor="middle" class="box-title">Fall / lying logic</text>
  <text x="737" y="432" text-anchor="middle" class="body">Track-specific timer</text><text x="737" y="454" text-anchor="middle" class="body">reduces one-frame false</text><text x="737" y="474" text-anchor="middle" class="body">alarms before alerting</text>
  <path d="M605 427 H535" class="arrow"/>

  <rect x="270" y="365" width="265" height="125" fill="url(#red)" class="box"/>
  <text x="402" y="402" text-anchor="middle" class="box-title">Outputs</text>
  <text x="402" y="432" text-anchor="middle" class="body">Annotated video overlay</text><text x="402" y="454" text-anchor="middle" class="body">CSV log: label, confidence,</text><text x="402" y="474" text-anchor="middle" class="body">lying time and alert</text>

  <path d="M737 490 V555" class="arrow"/>
  <rect x="555" y="555" width="365" height="105" fill="#fee2e2" class="box"/>
  <text x="737" y="594" text-anchor="middle" class="box-title">Safety event</text>
  <text x="737" y="624" text-anchor="middle" class="body">Alert means a possible fall/continued lying state;</text><text x="737" y="646" text-anchor="middle" class="body">it is not a medical diagnosis.</text>

  <text x="80" y="735" class="section">B. Training and evaluation pipeline</text>
  <rect x="80" y="770" width="215" height="125" fill="url(#blue)" class="box"/>
  <text x="187" y="807" text-anchor="middle" class="box-title">Collected data</text><text x="187" y="837" text-anchor="middle" class="body">GMDCSA24 + user videos</text><text x="187" y="859" text-anchor="middle" class="body">+ falling-down augmentation</text>
  <path d="M295 832 H350" class="arrow"/>
  <rect x="350" y="770" width="215" height="125" fill="url(#blue)" class="box"/>
  <text x="457" y="807" text-anchor="middle" class="box-title">Clean and sort</text><text x="457" y="837" text-anchor="middle" class="body">Review segments, labels,</text><text x="457" y="859" text-anchor="middle" class="body">groups and pose quality</text>
  <path d="M565 832 H620" class="arrow"/>
  <rect x="620" y="770" width="215" height="125" fill="url(#green)" class="box"/>
  <text x="727" y="807" text-anchor="middle" class="box-title">Pose extraction</text><text x="727" y="837" text-anchor="middle" class="body">YOLO11n-pose → 12-frame</text><text x="727" y="859" text-anchor="middle" class="body">normalized pose sequences</text>
  <path d="M835 832 H890" class="arrow"/>
  <rect x="890" y="770" width="215" height="125" fill="url(#orange)" class="box"/>
  <text x="997" y="807" text-anchor="middle" class="box-title">Train action head</text><text x="997" y="837" text-anchor="middle" class="body">Compare Logistic Regression</text><text x="997" y="859" text-anchor="middle" class="body">and Random Forest</text>
  <path d="M1105 832 H1160" class="arrow"/>
  <rect x="1160" y="770" width="215" height="125" fill="url(#orange)" class="box"/>
  <text x="1267" y="807" text-anchor="middle" class="box-title">Evaluate</text><text x="1267" y="837" text-anchor="middle" class="body">Grouped hold-out split,</text><text x="1267" y="859" text-anchor="middle" class="body">accuracy, F1, confusion matrix</text>
  <path d="M1267 770 V690 H737 V660" class="dash"/>
  <text x="1060" y="686" class="small">validated classifier bundle feeds runtime</text>
</svg>
