# Boat broker (laptop bench stands in for the hybrid Orin's mosquitto): local bus on 1884 + bridge to the hub.
listener 1884 127.0.0.1
protocol mqtt
allow_anonymous true
persistence true
persistence_location /tmp/optiprimex_boat/
max_queued_messages 10000
sys_interval 2
log_type error
log_type warning
log_type notice

# ---- bridge to the hub (same lines as bridge.conf; inlined so the file is self-contained) ----
connection ocs
address 127.0.0.1:1882
cleansession false
notifications true
notification_topic $SYS/broker/connection/ocs/state
restart_timeout 1 5
# v0.1.86.7 (WP43 Tier 1.5): a silently dead peer seen in ~10 s (default 60: ~120 s, measured)
keepalive_interval 5
try_private true
bridge_protocol_version mqttv311
topic team/optiprime/v1/status/usv/# out 0
topic team/optiprime/v1/telemetry/usv/# out 0
# v0.1.43 (OCS_V2_SPEC §11): the Jetsons' host-health beat local/usv/host/<nx|agx> -> the hub as team/optiprime/v1/telemetry/usv/host/<host>
topic host/+ out 0 local/usv/ team/optiprime/v1/telemetry/usv/
topic team/optiprime/v1/ack/usv/# out 1
topic team/optiprime/v1/event/usv/# out 1
topic team/optiprime/v1/cmd/usv/# in 1
topic ocs/state in 0
topic team/optiprime/v1/event/uav/# in 1
topic status/uav out 0 team/optiprime/v1/ team/optiprime/v1/relay/usv/
topic event/uav/# out 1 team/optiprime/v1/ team/optiprime/v1/relay/usv/
topic ack/uav/# out 1 team/optiprime/v1/ team/optiprime/v1/relay/usv/
topic team/optiprime/v1/cmd/uav/# in 1
# v0.1.66 (WP16, D21): the UAV's buoys relayed onto the hub land here as local/usv/uav/perception/buoys (the bench's copy of the bridge)
topic perception/# in 0 local/usv/uav/ uav/
