# OCS hub (laptop bench): vehicles bridge in, the browser uses websockets 9001.
# Bench: anonymous access on localhost; the final profile adds users + ACL (deploy/mosquitto/acl).
listener 1882 127.0.0.1
protocol mqtt
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
persistence true
persistence_location /tmp/optiprimex_hub/
max_queued_messages 10000
sys_interval 2
log_type error
log_type warning
log_type notice
