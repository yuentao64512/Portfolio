# The simulated pool (ROADMAP WP1, decided 2026-11-02: 50 m x 25 m) for sim/fake_perception.py and sim/fake_dock.py.
# Frame: x_n north, y_e east, metres from `origin`. The fake FCU starts at the origin heading north (its defaults
# = Course Alpha's centre 1.2810202 / 103.8550097 since v0.1.33, hdg 0), so `start` is (0, 0, 0) and the pool runs north from the south wall at x_n -3.
# fake_perception locates the boat in THIS frame from the lat/lon in mm/state, so the world stays put whatever control
# origin the mission manager or usv_ui use.
#
# Task 1 (west half, handbook 3.3.2): ten buoys - flashing BLUE entry, three RED/GREEN pairs (GREEN to port, RED to
# starboard when travelling north), two unlit BLACK obstacles, steady BLUE exit. Lights flash 1 s on / 1 s off.
# Task 3 (north end, east half, handbook 3.3.4): a dock with three bays numbered 1..3 left to right when facing it
# (facing north: left = west); each bay has a white building with a colour indicator at its base (one GREEN = the bay
# to dock in, the others RED) and two 25 cm target windows; fake_dock lights one window RED once the boat has docked,
# turns it GREEN after enough on-target water, GREEN stays 5 s then the window goes off.
name: world_pool
origin: {lat: 1.2810202, lon: 103.8550097}          # Course Alpha's centre, Marina Bay (v0.1.33; was 1.3000 / 103.8000)
start: {x_n: 0.0, y_e: 0.0, hdg_deg: 0.0}
teleports:                                 # v0.1.33: the SIM page's and the OCS MAP tab's buttons (x_n, y_e, hdg); `start` is always first
  - {name: before gate 1, x_n: 8.0,  y_e: -6.0, hdg: 0.0}
  - {name: abeam bay 2,   x_n: 36.0, y_e: 5.5,  hdg: 0.0}        # 9 m off: the real camera (51 deg) sees two bays
  - {name: N32 E3 dock,   x_n: 32.0, y_e: 3.0,  hdg: 0.0}
course: bounds                            # v0.1.46.1: the fake judge's course (RxCourse) - the pool walls; rc-test / RoboCommand's own course overrides it
course_id: SIM-POOL
bounds:                                    # the pool walls (drawn by map.html / sim.html; not seen by the camera)
  - [-3.0, -12.5]
  - [47.0, -12.5]
  - [47.0, 12.5]
  - [-3.0, 12.5]

camera:                                    # ZED 2i 4 mm preset from pathing_sim (gate_pathing_simulator_spec 4.1)
  name: zed2i_left
  intrinsics: zed2i_hd2k          # the field of view from optiprimex/sim/zed.py (50.9 deg, v0.1.34; was 72)
  min_range_m: 0.5
  max_range_m: 25.0                        # depth range (bearing-only detections beyond it are not modelled)
  hz: 5
  noise_range_abc: [0.02, 0.0, 0.0015]     # sigma_r = a + b r + c r^2
  noise_bearing_deg: 0.25
  p_drop_max: 0.7                          # miss probability at max range; ramps from 0 at 0.6 x max range
  p_miscolour_max: 0.5                     # wrong-colour probability at max range, same ramp
  conf: 0.85
  window_max_range_m: 8.0                  # Task 3 target windows (25 cm) are resolved only this close

lights: {period_s: 2.0, on_s: 1.0}         # flashing = on for on_s of every period_s, random phase per buoy (seeded)

objects:
  # v0.1.36: the flashing buoys have a dark body (`body: black`) and the colour in their light - the camera then sees the light's
  # colour when it is on and black when it is off (the flash), as the handbook's states (flashing / solid / OFF) imply
  # ---- Task 1: Safe Passage (10 buoys) ----------------------------------------------------------------------------
  - {id: 1,  kind: buoy, colour: blue,  light: flash, body: black,  role: entry, x_n: 5.0,  y_e: -7.0}
  - {id: 2,  kind: buoy, colour: green, light: flash, body: black,  gate: 1,     x_n: 12.0, y_e: -7.2}
  - {id: 3,  kind: buoy, colour: red,   light: flash, body: black,  gate: 1,     x_n: 12.0, y_e: -4.8}
  - {id: 4,  kind: buoy, colour: green, light: flash, body: black,  gate: 2,     x_n: 19.0, y_e: -5.7}
  - {id: 5,  kind: buoy, colour: red,   light: flash, body: black,  gate: 2,     x_n: 19.0, y_e: -3.3}
  - {id: 6,  kind: buoy, colour: green, light: flash, body: black,  gate: 3,     x_n: 26.0, y_e: -7.2}
  - {id: 7,  kind: buoy, colour: red,   light: flash, body: black,  gate: 3,     x_n: 26.0, y_e: -4.8}
  - {id: 8,  kind: buoy, colour: black, light: off,    role: obstacle, x_n: 15.5, y_e: -9.5}
  - {id: 9,  kind: buoy, colour: black, light: off,    role: obstacle, x_n: 22.5, y_e: -1.5}
  - {id: 10, kind: buoy, colour: blue,  light: steady, role: exit,  x_n: 33.0, y_e: -5.5}
  # ---- Task 3: Coordinated Logistics dock (bays 3.5 m wide, building faces on x_n = 45, openings to the south) -----
  - {id: 21, kind: dock, colour: red,   bay: 1, x_n: 45.0, y_e: 2.0}
  - {id: 22, kind: dock, colour: green, bay: 2, x_n: 45.0, y_e: 5.5}
  - {id: 23, kind: dock, colour: red,   bay: 3, x_n: 45.0, y_e: 9.0}
  - {id: 31, kind: window, colour: black, lit: false, bay: 1, window: 1, x_n: 45.0, y_e: 1.4}
  - {id: 32, kind: window, colour: black, lit: false, bay: 1, window: 2, x_n: 45.0, y_e: 2.6}
  - {id: 33, kind: window, colour: black, lit: false, bay: 2, window: 1, x_n: 45.0, y_e: 4.9}
  - {id: 34, kind: window, colour: black, lit: false, bay: 2, window: 2, x_n: 45.0, y_e: 6.1}
  - {id: 35, kind: window, colour: black, lit: false, bay: 3, window: 1, x_n: 45.0, y_e: 8.4}
  - {id: 36, kind: window, colour: black, lit: false, bay: 3, window: 2, x_n: 45.0, y_e: 9.6}
  # pontoon fingers between the bays (truth only: drawn, never reported by the camera)
  - {id: 41, kind: pontoon, sensed: false, x_n: 41.5, y_e: 0.25,  x2_n: 45.0, y2_e: 0.25}
  - {id: 42, kind: pontoon, sensed: false, x_n: 41.5, y_e: 3.75,  x2_n: 45.0, y2_e: 3.75}
  - {id: 43, kind: pontoon, sensed: false, x_n: 41.5, y_e: 7.25,  x2_n: 45.0, y2_e: 7.25}
  - {id: 44, kind: pontoon, sensed: false, x_n: 41.5, y_e: 10.75, x2_n: 45.0, y2_e: 10.75}

dock:                                      # fake_dock's defaults (sim/dock/cmd overrides at run time)
  green_bay: 2
  auto: false                              # v0.1.48 (WP10j-b): the window lights on our DockingReport (the judges' way), not the dwell
  docked_dwell_s: 3.0                      # boat inside the GREEN bay this long (and slow) = docked (auto mode: fake_dock --auto on)
  bay_depth_m: 3.5                         # a bay = the box from the face back to face - bay_depth_m, bay width wide
  bay_width_m: 3.5
  fire_on_target_s: 4.0                    # cannon aimed at the lit window this long -> GREEN
  green_hold_s: 5.0                        # GREEN stays this long, then the window goes off (handbook core tier)
