# v0.1.90.3 (Dmitrii, venue: "clear the missions presets, should be very straight forward"): the buttons are 1 · USV only, 2 · UAV only,
# 3 · UAV + USV, sim, custom; lab / bench-uavmap / m1t1-usv (scout) are `hidden: true` (kept, not shown).
# The launcher's presets (v0.1.86 WP42: sim · lab · 0 bench-uavmap · 1 m1t2-uav · 2 m1t2-both · 3 m1t1-usv · 3b m1t1-gates · custom; event removed; v0.1.38; v0.1.42 WP9d: sim / lab / event / custom - the profile cut, one word per situation; scripts/launch.sh -> http://127.0.0.1:8094/): one starting point per situation; every field can be
# changed on the page before LAUNCH. The fields (optiprimex/tools/launcher.py FIELDS):
#   mode        sim (the Mac only: run_sim.sh) | real (three hosts: run_ocs.sh here, run_usv.sh on the NX, run_agx.sh on the AGX over ssh)
#   judge       venue (DEMO rc-test, VLAN 70: the default) | alpha .. delta (the course RoboCommand .2:1883) | course (RC_HOST) | fake (ours) | rctest (last)
#   net         ts (tailnet) | lan (the pool / event switch) | manual (the addresses typed on the page)
#   fcu         fake | uart | usb | eth                 (real mode; sim = the simulator's plant)
#   usv_profile pool | lab | course                     (real mode: run_usv.sh --pool | --lab | --course; test mode follows the profile)
#   cv          real | fake | off                       (real mode: the AGX's cv_publish | run_agx.sh --sim | nothing)
#   perception  camera | geometric                      (sim mode: the camera path to the map | the fast geometric fake)
#   world       pool | marina | boxes | por | empty     (sim, and the AGX's fake CV)
#   usv_ui      true | false                            (sim: usv_ui on the simulated boat)
#   heartbeat_hz, status_hz, map_hz                     (the OCS's heartbeat to RoboCommand; the boat's status and map rates)
#   ui          v2 | v1                              (v0.1.43: the OCS page; v1 = the classic page frozen at /v1/)
#   log         false | true                            (LOG=1: every MQTT message to SQLite)
#   usv_window  mac | nx | off                         (v0.1.63, real mode: where the USV window serves the team LAN for a delegate)
#   auto_mission false | true                           (v0.1.86: with `mission` - RunStart -> 3-2-1 -> start_task by itself; true by default on the real presets)
#   mission     none | m4t0 | m1t1 | m1t2 | scout | m3t1 | m0t4 | m0t8 | m0t9   (v0.1.86: preselected at launch; `ocs_cli mission off` clears it)
#   tiers       profile | {T1: ADVANCED, T2: NONE, ...}  (v0.1.86: the declaration's tier row for the run; T4 NONE = the preset's yes to 'are you sure?')
#   t4          false | true                         (v0.1.88: T4 Dynamic Incident Response - on = T4 TIER_CORE, off = TIER_NONE; the launcher's
#                                                    tick box, off in every preset; it wins over the tier row's T4; an operator's
#                                                    `mission ... --t4` in the OCS wins over both)
#   lucky       false | true                         (v0.1.90: m1t1 / m1t2 take the closest uncertain-colour pair inside the course as a
#                                                    gate, and go straight to the gates when no flashing blue entry is found - a risk)
#   record      auto | off                              (v0.1.86: the ZED recording at DECLARE; forced off unless cv real; the observer records from launch with depth pairs)
#   uav         off | on                               (v0.1.65: the UAV adapter + the UAV window; every preset off - `declare uav` decides the declaration)
#   free_run    off | on                               (v0.1.68, lab and custom only: the mission manager on a ghost plant, mode requests only to
#                                                       the real FCU, the AGX's fake CV on the same world; never with judge course)
sim:
  title: "sim"
  about: "the Mac alone - rehearse between runs: the simulator on the water day's hull (omni_usv), world marina, scout preselected (one click away)"
  mode: sim
  judge: fake
  net: ts
  fcu: fake
  usv_profile: course
  cv: real
  world: marina
  log: false
  usv_window: mac
  uav: "off"
  mission: scout
  auto_mission: false
  tiers: profile
  t4: false
  lucky: false
  record: "off"
  perception: camera
  usv_ui: true
  heartbeat_hz: 2
  status_hz: 2
  map_hz: 2
